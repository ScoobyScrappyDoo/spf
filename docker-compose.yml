# Statistical Football on the NAS: Container Manager → Project, with this folder. Step by step: NAS.md.
# Your settings (session code, who's invited) are in the file .env next to this one, not here: .env stays out of git
# (and so off GitHub). Start it from .env.example. How to apply a change: NAS.md, "Changing settings".
# Signed-in friends stay signed in (the volume keeps their sessions), unless you took them off ALLOWED_EMAILS.
services:
  spf:
    build: .
    image: statistical-football:latest
    container_name: statistical-football
    restart: unless-stopped
    ports:
      # NAS port 8330 → the game server inside the container (port 3000).
      # Step 5 (reverse proxy) changes this to "127.0.0.1:8330:3000": then only DSM's reverse proxy can reach it.
      - "8330:3000"
    environment:
      # The address people type. First test at home: the NAS's own address. From step 5: https://<name>.synology.me
      PUBLIC_URL: "http://192.168.178.84:8330"
      # The session code and the invite list come from .env. Without a .env the code stays change-me, and the server
      # refuses to start: nobody gets in by accident.
      SIGNIN_CODE: "${SIGNIN_CODE:-change-me}"
      ALLOWED_EMAILS: "${ALLOWED_EMAILS:-}"
      # From step 5 (behind DSM's reverse proxy): "1", so the sign-in log shows visitors' real addresses.
      TRUST_PROXY: "0"
    volumes:
      - spf-data:/app/data   # sessions and the sign-in log; kept when the container is rebuilt
    # Locked down: a read-only system, no special rights, a memory cap. The game needs none of these.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m

volumes:
  spf-data:
